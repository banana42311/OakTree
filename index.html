<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tree Breathing — Air Quality Visualization</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Noto+Sans+KR:wght@300;400&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-text-size-adjust: 100%;
  }

  body {
    position: fixed;
    inset: 0;
    font-family: 'Noto Sans KR', sans-serif;
  }

  #viewer {
    position: fixed;
    inset: 0;
    width: 100vw;
    width: 100svw;
    height: 100vh;
    height: 100svh;
    display: block;
    touch-action: none;
  }

  /* ── 로딩 ── */
  #loading {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 20px;
    padding: 0 24px max(44px, calc(env(safe-area-inset-bottom) + 34px));
    z-index: 200;
    transition: opacity 0.8s;
  }
  #loading-text {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.4);
  }
  #loading-bar-wrap {
    width: 200px;
    height: 1px;
    background: rgba(255,255,255,0.08);
    border-radius: 1px;
    overflow: hidden;
  }
  #loading-bar {
    height: 100%;
    width: 0%;
    background: rgba(255,255,255,0.5);
    transition: width 0.3s;
  }

  #error-msg {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 300;
    background: #000;
    color: rgba(255,255,255,0.5);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    text-align: center;
    line-height: 1.8;
    padding: 40px;
  }

  /* ── Air Pollution banding — 좌상단 ── */
  #pollution-display {
    position: fixed;
    top: 24px; left: 24px;
    z-index: 100;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    max-width: calc(100vw - 210px);
    color: rgba(255,255,255,0.88);
    text-shadow: 0 2px 18px rgba(0,0,0,0.85);
    --band-color: #4ade80;
  }
  #banding-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    line-height: 1.35;
  }
  #banding-value {
    display: flex;
    align-items: baseline;
    gap: 12px;
    font-family: 'DM Mono', monospace;
    font-weight: 300;
    line-height: 1;
  }
  #banding-name {
    font-size: 20px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--band-color);
  }
  #banding-number {
    font-size: 36px;
    letter-spacing: 0;
    color: rgba(190,192,186,0.84);
  }
  #scenario-control {
    position: fixed;
    top: max(24px, env(safe-area-inset-top));
    right: 24px;
    z-index: 110;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 7px;
  }
  #scenario-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    text-shadow: 0 2px 18px rgba(0,0,0,0.85);
    white-space: nowrap;
  }
  #scenario-toggle {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 32px;
    padding: 0 7px 0 11px;
    border: 0;
    border-radius: 999px;
    background: rgba(0,0,0,0.22);
    color: rgba(255,255,255,0.50);
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), 0 8px 22px rgba(0,0,0,0.22);
    cursor: pointer;
    touch-action: manipulation;
  }
  #scenario-switch {
    position: relative;
    width: 44px;
    height: 24px;
    border-radius: 999px;
    background: rgba(255,255,255,0.05);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.28);
    transition: box-shadow 0.28s ease;
  }
  #scenario-switch::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    border-radius: 999px;
    background: var(--scenario-color, #4ade80);
    box-shadow: 0 0 12px var(--scenario-color), 0 2px 8px rgba(0,0,0,0.34);
    transition: transform 0.28s ease, background 0.28s ease, box-shadow 0.28s ease;
  }
  #scenario-toggle.scenario-good { --scenario-color: #4ade80; }
  #scenario-toggle.scenario-bad { --scenario-color: #f87171; }
  #scenario-toggle.scenario-good #scenario-switch::after {
    transform: translateX(20px);
  }
  #info-dock {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 9px;
    margin-top: 8px;
  }
  .info-button {
    width: 31px;
    height: 31px;
    border: 0;
    border-radius: 999px;
    background: rgba(0,0,0,0.16);
    color: rgba(210,212,206,0.72);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    line-height: 1;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    box-shadow: inset 0 0 0 1px rgba(210,212,206,0.24), 0 8px 22px rgba(0,0,0,0.24);
    cursor: pointer;
    touch-action: manipulation;
  }
  .info-button:active {
    transform: scale(0.94);
    color: rgba(255,255,255,0.88);
    box-shadow: inset 0 0 0 1px rgba(210,212,206,0.42), 0 4px 18px rgba(0,0,0,0.26);
  }

  /* ── Information stack ── */
  #info-overlay {
    --info-stack-top: max(100px, calc(env(safe-area-inset-top) + 74px));
    position: fixed;
    inset: 0;
    z-index: 260;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding: var(--info-stack-top) 24px 0;
    background: rgba(0,0,0,0.08);
    opacity: 0;
    transition: opacity 0.24s ease;
    touch-action: pan-y;
  }
  #info-overlay.is-open {
    display: flex;
    opacity: 1;
  }
  #info-stack {
    position: relative;
    width: min(330px, calc(100vw - 48px));
    height: calc(100vh - var(--info-stack-top));
    height: calc(100dvh - var(--info-stack-top));
    max-height: none;
    border-radius: 27px 27px 0 0;
    overflow: hidden;
    background:
      linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
      rgba(54,55,49,0.58);
    -webkit-backdrop-filter: blur(20px) saturate(0.9);
    backdrop-filter: blur(20px) saturate(0.9);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,0.15),
      0 18px 60px rgba(0,0,0,0.46);
    color: rgba(255,255,255,0.9);
    transform: translateY(12px) scale(0.98);
    transition: transform 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
    touch-action: pan-y;
  }
  #info-overlay.is-open #info-stack {
    transform: translateY(0) scale(1);
  }
  #info-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.78);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    z-index: 2;
    cursor: pointer;
    touch-action: manipulation;
  }
  #info-scroll {
    height: 100%;
    max-height: none;
    overflow-y: auto;
    padding: 58px 20px 24px;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
  }
  #info-scroll::-webkit-scrollbar {
    width: 3px;
  }
  #info-scroll::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.22);
    border-radius: 999px;
  }
  .info-section + .info-section {
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid rgba(255,255,255,0.12);
  }
  .info-heading {
    margin-bottom: 14px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.56);
  }
  .info-copy {
    font-size: 16px;
    line-height: 1.22;
    letter-spacing: 0;
    color: rgba(255,255,255,0.9);
  }
  .info-copy p + p,
  .info-copy ol + p,
  .info-copy p + ol {
    margin-top: 14px;
  }
  .info-copy ol {
    list-style-position: outside;
    padding-left: 21px;
  }
  .info-copy li + li {
    margin-top: 10px;
  }
  /* ── 날짜 다이얼 — 하단 전체폭 ── */
  #aqi-panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(4px, env(safe-area-inset-bottom));
    height: 96px;
    z-index: 100;
    pointer-events: none;
    --dial-offset: 0px;
    --dial-step: 40px;
    --dial-width: 520px;
    --band-color: #4ade80;
    --timeline-progress: 0%;
  }
  #selected-date-display {
    position: absolute;
    left: 50%;
    bottom: 1px;
    width: min(300px, 82vw);
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    color: #fff;
    text-shadow: 0 2px 18px rgba(0,0,0,0.85);
    pointer-events: none;
    transition: transform 0.08s ease;
  }
  #selected-date-label {
    display: none;
  }
  #selected-date-value {
    font-family: 'DM Mono', monospace;
    font-size: 18px;
    font-weight: 300;
    line-height: 1;
    letter-spacing: 0.03em;
    color: rgba(190,192,186,0.86);
    white-space: nowrap;
  }
  #aqi-row {
    display: none;
  }
  #slider-wrap {
    position: absolute;
    left: 0;
    right: 0;
    top: 8px;
    height: 56px;
    overflow: hidden;
    pointer-events: auto;
    touch-action: none;
  }
  #slider-wrap::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 34px;
    height: 1px;
    background: linear-gradient(90deg,
      rgba(255,255,255,0),
      rgba(255,255,255,0.28) 18%,
      rgba(255,255,255,0.52) 50%,
      rgba(255,255,255,0.28) 82%,
      rgba(255,255,255,0)
    );
    box-shadow: 0 0 20px rgba(255,255,255,0.08);
  }
  #slider-wrap::after {
    content: '';
    position: absolute;
    left: -112%;
    top: 12px;
    width: 112%;
    height: 46px;
    background: linear-gradient(90deg,
      rgba(255,255,255,0),
      rgba(255,255,255,0.04) 16%,
      rgba(255,255,255,0.20) 38%,
      rgba(255,255,255,0.38) 50%,
      rgba(255,255,255,0.20) 62%,
      rgba(255,255,255,0.04) 84%,
      rgba(255,255,255,0)
    );
    filter: blur(0.45px);
    mix-blend-mode: screen;
    transform: translateX(-20%) skewX(-18deg);
    opacity: 0;
    animation: sliderSheen 14.0s ease-in-out 0.5s infinite both;
    pointer-events: none;
  }
  #dial-bars {
    position: absolute;
    left: 50%;
    top: 19px;
    width: var(--dial-width);
    height: 30px;
    background: repeating-linear-gradient(
      to right,
      rgba(255,255,255,0.15) 0 1px,
      transparent 1px var(--dial-step)
    );
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 1%, #000 99%, transparent 100%);
    mask-image: linear-gradient(90deg, transparent 0%, #000 1%, #000 99%, transparent 100%);
    pointer-events: none;
    will-change: transform;
  }
  #timeline-marker {
    position: absolute;
    left: 50%;
    top: 13px;
    width: 3px;
    height: 42px;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.58);
    border-radius: 2px;
    box-shadow: 0 0 18px rgba(255,255,255,0.30);
    pointer-events: none;
    transition: height 0.08s ease, top 0.08s ease, background 0.18s ease;
  }
  #timeline-marker::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 21px;
    width: 11px;
    height: 11px;
    transform: translate(-50%, -50%);
    border-radius: 999px;
    background: color-mix(in srgb, var(--band-color) 58%, #8a8a8a);
    box-shadow: 0 0 14px color-mix(in srgb, var(--band-color) 55%, transparent);
    transition: transform 0.08s ease, background 0.18s ease, box-shadow 0.18s ease;
  }
  #aqi-panel.is-ticking #timeline-marker {
    top: 10px;
    height: 48px;
    background: rgba(255,255,255,0.72);
  }
  #aqi-panel.is-ticking #timeline-marker::after {
    transform: translate(-50%, -50%) scale(1.18);
  }
  #aqi-panel.is-ticking #selected-date-display {
    transform: translateX(-50%) translateY(-1px);
  }
  #dateSlider {
    position: absolute;
    inset: 0;
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 56px;
    background: transparent;
    outline: none;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
  }
  #dateSlider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 44px; height: 56px;
    border-radius: 0;
    background: #fff;
    cursor: pointer;
  }
  #dateSlider::-moz-range-thumb {
    width: 44px; height: 56px;
    border: 0;
    border-radius: 0;
    background: #fff;
    cursor: pointer;
  }
  @keyframes sliderSheen {
    0%, 18% {
      opacity: 0;
      transform: translateX(-12%) skewX(-18deg);
    }
    30% {
      opacity: 0.34;
    }
    66% {
      opacity: 0.44;
      transform: translateX(190%) skewX(-18deg);
    }
    84% {
      opacity: 0.24;
    }
    100% {
      opacity: 0;
      transform: translateX(220%) skewX(-18deg);
    }
  }

  @media (max-width: 640px) {
    #pollution-display {
      top: max(34px, env(safe-area-inset-top));
      left: 28px;
    }
    #banding-title { font-size: 10px; }
    #banding-name { font-size: 18px; }
    #banding-number { font-size: 34px; }
    #scenario-control {
      top: max(34px, env(safe-area-inset-top));
      right: 22px;
    }
    #aqi-panel {
      bottom: max(4px, env(safe-area-inset-bottom));
      height: 96px;
    }
    #selected-date-value { font-size: 18px; }
    #info-overlay {
      --info-stack-top: max(120px, calc(env(safe-area-inset-top) + 82px));
      padding: var(--info-stack-top) 22px 0;
    }
    #info-stack {
      width: min(326px, calc(100vw - 44px));
      height: calc(100vh - var(--info-stack-top));
      height: calc(100dvh - var(--info-stack-top));
      max-height: none;
    }
    #info-scroll {
      padding: 58px 19px 24px;
    }
    .info-copy {
      font-size: 16px;
    }
  }

</style>
</head>
<body>

<!-- 로딩 스크린 -->
<div id="loading">
  <div id="loading-text">LOADING SCENE</div>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
</div>

<!-- 에러 스크린 -->
<div id="error-msg"></div>

<!-- 메인 캔버스 -->
<canvas id="viewer"></canvas>

<!-- Air Pollution banding — 좌상단 -->
<div id="pollution-display">
  <span id="banding-title">Daily Air Quality Index (DAQI)</span>
  <div id="banding-value">
    <span id="banding-name">Low</span>
    <span id="banding-number">1</span>
  </div>
</div>
<div id="scenario-control">
  <span id="scenario-title">Future Scenario</span>
  <button id="scenario-toggle" class="scenario-good" type="button" aria-label="Switch future air quality scenario" aria-pressed="false">
    <span id="scenario-label">Good</span>
    <span id="scenario-switch" aria-hidden="true"></span>
  </button>
  <div id="info-dock" aria-label="Information panels">
    <button class="info-button" type="button" data-info-panel="all" aria-label="Open project information">i</button>
  </div>
</div>

<!-- 날짜 다이얼 — 하단 전체폭 -->
<div id="aqi-panel">
  <div id="slider-wrap">
    <div id="dial-bars"></div>
    <div id="timeline-marker"></div>
    <input type="range" id="dateSlider" min="0" max="13" value="13" step="1" aria-label="Daily average air quality date history">
  </div>
  <div id="selected-date-display">
    <div id="selected-date-value"></div>
  </div>
</div>

<div id="info-overlay" aria-hidden="true">
  <section id="info-stack" role="dialog" aria-modal="true" aria-label="Project information">
    <button id="info-close" type="button" aria-label="Close information">x</button>
    <div id="info-scroll"></div>
  </section>
</div>

<!-- Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ── 유틸 ──────────────────────────────────────────────────
function lerp(a, b, t) { return a + (b - a) * t; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ── 공통 AQI 색상 함수 (브랜치 + 파티클 동일 적용) ──────────
// aqi: 1~10, returns [r, g, b] 0~1 범위
function aqiToRGB(aqi) {
  if (aqi <= 1) return [0.29, 0.87, 0.50]; // 1: 초록 (#4ade80)
  if (aqi <= 2) return [0.24, 0.75, 0.43]; // 2: 초록 (중간)
  if (aqi <= 3) return [0.19, 0.65, 0.36]; // 3: 초록 (진하게)
  if (aqi <= 4) return [0.98, 0.90, 0.08]; // 4: 노랑 (밝게)
  if (aqi <= 5) return [0.98, 0.80, 0.08]; // 5: 노랑 (#facc15)
  if (aqi <= 6) return [0.98, 0.72, 0.08]; // 6: 노랑-주황
  if (aqi <= 7) return [0.98, 0.62, 0.22]; // 7: 주황 (#fb923c)
  if (aqi <= 8) return [0.98, 0.52, 0.22]; // 8: 주황 (진하게)
  if (aqi <= 9) return [0.97, 0.44, 0.44]; // 9: 빨강-핑크 (#f87171)
  return              [0.60, 0.02, 0.02];  // 10: 짙은 붉은색 (OakTree16 기준)
}

// ── AQI 스타일 정의 ───────────────────────────────────────
function withLeafBreathParams(a, style) {
  const stress = clamp((a - 1) / 9, 0, 1);
  const treeStress = clamp((a - 7) / 3, 0, 1);
  return {
    ...style,
    // 이 두 값을 직접 만지면 잎의 호흡/수축감을 섬세하게 조절할 수 있어요.
    leafBreathSize: lerp(1.20, 0.10, stress), // AQI 1: 큰 호흡, AQI 10: 작은 호흡
    leafContract: lerp(0.00, 0.2, stress),   // AQI 1: 펼침, AQI 10: 안쪽으로 수축
    // tree_scan2.ply 본체 채도 조절. AQI 7 이하는 원본에 가깝고, 10에 가까울수록 회색빛이 강해져요.
    treeSatMul: lerp(1.0, 0.32, treeStress),
  };
}

function getAQIStyle(a) {
  if (a <= 3) return withLeafBreathParams(a, { label:'Low',       bg:'#1a2e1a', fg:'#4ade80', hueShift:0,   satMul:1.0,  brightMul:1.60, fogDensity:0,    crackOpen:0,    breathSpeed:0.36,  pulseSize:0.18, aqi: a });
  if (a <= 6) return withLeafBreathParams(a, { label:'Mid',       bg:'#2a2510', fg:'#facc15', hueShift:-15, satMul:0.88, brightMul:1.40, fogDensity:0.08, crackOpen:0.2,  breathSpeed:0.34, pulseSize:0.28, aqi: a });
  if (a <= 8) return withLeafBreathParams(a, { label:'High',      bg:'#2a1a0a', fg:'#fb923c', hueShift:-35, satMul:0.68, brightMul:1.20, fogDensity:0.2,  crackOpen:0.52, breathSpeed:0.32, pulseSize:0.45, aqi: a });
  if (a <= 9) return withLeafBreathParams(a, { label:'High',      bg:'#2a0a0a', fg:'#f87171', hueShift:-60, satMul:0.38, brightMul:1.00, fogDensity:0.38, crackOpen:0.82, breathSpeed:0.30, pulseSize:0.68, aqi: a });
  return      withLeafBreathParams(a, { label:'Very High', bg:'#1a0505', fg:'#990505', hueShift:-90, satMul:0.12, brightMul:0.80, fogDensity:0.60, crackOpen:1.0,  breathSpeed:0.28, pulseSize:0.90, aqi: a });
}

const canvas = document.getElementById('viewer');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);

const scene = new THREE.Scene();
const rootGroup = new THREE.Group();
rootGroup.rotation.x = 5 * (Math.PI / 180);
scene.add(rootGroup);
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);

// ── 간단한 오비트 컨트롤 ──────────────────────────────────
const MODEL_ROTATION_TARGET = new THREE.Vector3(0, 0, 0);
// EDIT_ROTATION_TARGET_HERE: tree_scan2.ply full-model center pivot.
const MODEL_ROTATION_Y_OFFSET = 0.0;
// EDIT_CAMERA_HEIGHT_HERE: lower this value to lower the camera.
const CAMERA_Y_OFFSET = 0.04;
const CAMERA_LOOK_AT_Y_OFFSET = 0.0;
// EDIT_INTRO_CAMERA_HERE: loading angle, Y-axis orbit, and zoom-in timing.
const INTRO_CAMERA = {
  duration: 5200,
  // Horizontal orbit around the model's vertical Y axis.
  startTheta: -0.52,
  endTheta: 0.28,
  // Vertical viewing angle. Kept constant during the intro to avoid tilt.
  startPhi: Math.PI / 2.5,
  endPhi: Math.PI / 2.5,
  startRadius: 3.72,
  endRadius: 2.95,
};
const orbit = {
  theta: INTRO_CAMERA.startTheta, phi: INTRO_CAMERA.startPhi, radius: INTRO_CAMERA.startRadius,
  dragging: false, panning: false,
  last: { x: 0, y: 0 },
  target: MODEL_ROTATION_TARGET.clone(),
};
let lastInteractionTime = performance.now();
let introStartTime = null;
let introActive = true;
let thetaVelocity = 0;
let phiVelocity = 0;
let activeTouchMode = 'none';
let lastTouch = null;
let pinchStartDistance = 0;
let pinchStartRadius = orbit.radius;
const PINCH_PAN_X_SIGN = -1; // EDIT_TWO_FINGER_LEFT_RIGHT_HERE: use 1 if horizontal pan should be flipped.
const PINCH_PAN_Y_SIGN = 1;

function setRotationTargetFromModelCenter(positionArray) {
  let minX = Infinity, minY = Infinity, minZ = Infinity;
  let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
  for (let i = 0; i < positionArray.length; i += 3) {
    const x = positionArray[i], y = positionArray[i + 1], z = positionArray[i + 2];
    if (!Number.isFinite(x) || !Number.isFinite(y) || !Number.isFinite(z)) continue;
    minX = Math.min(minX, x); maxX = Math.max(maxX, x);
    minY = Math.min(minY, y); maxY = Math.max(maxY, y);
    minZ = Math.min(minZ, z); maxZ = Math.max(maxZ, z);
  }
  if (!Number.isFinite(minX)) return;

  MODEL_ROTATION_TARGET.set(
    (minX + maxX) * 0.5,
    (minY + maxY) * 0.5 + MODEL_ROTATION_Y_OFFSET,
    (minZ + maxZ) * 0.5,
  );
  orbit.target.copy(MODEL_ROTATION_TARGET);
}

function markInteraction() {
  lastInteractionTime = performance.now();
  introActive = false;
}

function getTouchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

function rotateOrbit(dx, dy, speed = 0.0065) {
  orbit.theta -= dx * speed;
  orbit.phi = clamp(orbit.phi - dy * speed, 0.24, Math.PI - 0.24);
  thetaVelocity = -dx * speed * 0.08;
  phiVelocity = -dy * speed * 0.04;
}

canvas.addEventListener('mousedown', e => {
  markInteraction();
  if (e.button === 2 || e.shiftKey) {
    orbit.panning = true;
  } else {
    orbit.dragging = true;
  }
  orbit.last = { x: e.clientX, y: e.clientY };
});
window.addEventListener('mouseup', () => {
  orbit.dragging = false;
  orbit.panning = false;
});
window.addEventListener('mousemove', e => {
  const dx = e.clientX - orbit.last.x, dy = e.clientY - orbit.last.y;
  if (orbit.dragging) {
    markInteraction();
    rotateOrbit(dx, dy, 0.0065);
  }
  if (orbit.panning) {
    markInteraction();
    const panSpeed = orbit.radius * 0.001;
    orbit.target.x -= dx * panSpeed;
    orbit.target.y += dy * panSpeed;
  }
  orbit.last = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  markInteraction();
  orbit.radius = clamp(orbit.radius + e.deltaY * 0.003, 0.55, 10);
}, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());

let lastPinchMidpoint = null;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  markInteraction();
  if (e.touches.length === 1) {
    activeTouchMode = 'rotate';
    lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    lastPinchMidpoint = null;
  } else if (e.touches.length >= 2) {
    activeTouchMode = 'pinch';
    pinchStartDistance = getTouchDistance(e.touches);
    pinchStartRadius = orbit.radius;
    lastPinchMidpoint = {
      x: (e.touches[0].clientX + e.touches[1].clientX) * 0.5,
      y: (e.touches[0].clientY + e.touches[1].clientY) * 0.5,
    };
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  markInteraction();
  if (e.touches.length === 1 && activeTouchMode === 'rotate' && lastTouch) {
    const dx = e.touches[0].clientX - lastTouch.x;
    const dy = e.touches[0].clientY - lastTouch.y;
    rotateOrbit(dx, dy, 0.006);
    lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  } else if (e.touches.length >= 2) {
    const dist = getTouchDistance(e.touches);
    const scale = dist / Math.max(1, pinchStartDistance);
    orbit.radius = clamp(pinchStartRadius / scale, 0.55, 10);
    const midX = (e.touches[0].clientX + e.touches[1].clientX) * 0.5;
    const midY = (e.touches[0].clientY + e.touches[1].clientY) * 0.5;
    if (lastPinchMidpoint) {
      const dx = midX - lastPinchMidpoint.x;
      const dy = midY - lastPinchMidpoint.y;
      const panSpeed = orbit.radius * 0.0012;
      const right = new THREE.Vector3();
      const up    = new THREE.Vector3();
      camera.matrix.extractBasis(right, up, new THREE.Vector3());
      orbit.target.addScaledVector(right, PINCH_PAN_X_SIGN * dx * panSpeed);
      orbit.target.addScaledVector(up,    PINCH_PAN_Y_SIGN * dy * panSpeed);
    }
    lastPinchMidpoint = { x: midX, y: midY };
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  markInteraction();
  if (e.touches.length === 0) {
    activeTouchMode = 'none';
    lastTouch = null;
    lastPinchMidpoint = null;
  } else if (e.touches.length === 1) {
    activeTouchMode = 'rotate';
    lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    lastPinchMidpoint = null;
  }
}, { passive: false });

function updateCamera() {
  camera.up.set(0, 1, 0);
  camera.position.set(
    orbit.target.x + orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta),
    orbit.target.y + orbit.radius * Math.cos(orbit.phi) + CAMERA_Y_OFFSET,
    orbit.target.z + orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta)
  );
  camera.lookAt(
    orbit.target.x,
    orbit.target.y + CAMERA_LOOK_AT_Y_OFFSET,
    orbit.target.z
  );
}

// ── PLY 로더 (바이너리 가우시안 스플랫) ───────────────────
async function loadPLY(url, onProgress) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Could not load file: ${url}`);
  const total = parseInt(res.headers.get('content-length') || '0');
  const reader = res.body.getReader();
  const chunks = [];
  let loaded = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    loaded += value.byteLength;
    if (total) onProgress(loaded / total);
  }
  const buffer = new Uint8Array(loaded);
  let offset = 0;
  for (const chunk of chunks) { buffer.set(chunk, offset); offset += chunk.byteLength; }
  return buffer.buffer;
}

function parsePLYHeader(buffer) {
  const text = new TextDecoder().decode(new Uint8Array(buffer, 0, Math.min(4096, buffer.byteLength)));
  const lines = text.split('\n');
  let headerEnd = 0, vertexCount = 0;
  const properties = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (line.startsWith('element vertex')) vertexCount = parseInt(line.split(' ')[2]);
    if (line.startsWith('property')) {
      const parts = line.split(' ');
      properties.push({ type: parts[1], name: parts[2] });
    }
    if (line === 'end_header') {
      headerEnd = text.indexOf('end_header') + 'end_header'.length + 1;
      break;
    }
  }
  return { headerEnd, vertexCount, properties };
}

function buildSplatGeometry(buffer, header) {
  const { headerEnd, vertexCount, properties } = header;

  // 각 프로퍼티 바이트 크기
  const sizeOf = { float: 4, uchar: 1, double: 8, int: 4, uint: 4, short: 2, ushort: 2 };
  let stride = 0;
  const propOffsets = {};
  for (const p of properties) {
    propOffsets[p.name] = stride;
    stride += (sizeOf[p.type] || 4);
  }

  const data = new DataView(buffer, headerEnd);

  const positions = new Float32Array(vertexCount * 3);
  const colors    = new Float32Array(vertexCount * 3);
  const sizes     = new Float32Array(vertexCount);
  const opacities = new Float32Array(vertexCount);

  // SH DC 계수 → RGB 변환 (가우시안 스플랫 기본)
  const SH_C0 = 0.28209479177387814;
  const safeNumber = (value, fallback = 0) => Number.isFinite(value) ? value : fallback;
  const safeExp = (value) => Math.exp(clamp(safeNumber(value, 0), -20, 20));

  for (let i = 0; i < vertexCount; i++) {
    const base = i * stride;
    const g = (name) => {
      const off = propOffsets[name];
      if (off === undefined) return 0;
      const prop = properties.find(p => p.name === name);
      if (!prop) return 0;
      if (prop.type === 'float') return data.getFloat32(base + off, true);
      if (prop.type === 'uchar') return data.getUint8(base + off);
      if (prop.type === 'double') return data.getFloat64(base + off, true);
      return data.getFloat32(base + off, true);
    };

    positions[i*3]   = safeNumber(g('x'));
    positions[i*3+1] = safeNumber(g('y'));
    positions[i*3+2] = safeNumber(g('z'));

    // SH → RGB (DC term)
    const r = clamp(0.5 + SH_C0 * safeNumber(g('f_dc_0')), 0, 1);
    const gv = clamp(0.5 + SH_C0 * safeNumber(g('f_dc_1')), 0, 1);
    const b = clamp(0.5 + SH_C0 * safeNumber(g('f_dc_2')), 0, 1);
    colors[i*3] = r; colors[i*3+1] = gv; colors[i*3+2] = b;

    // opacity (sigmoid)
    const rawOp = safeNumber(g('opacity'));
    opacities[i] = 1 / (1 + Math.exp(-rawOp));

    // scale → point size
    const sx = safeExp(g('scale_0')), sy = safeExp(g('scale_1')), sz = safeExp(g('scale_2'));
    sizes[i] = safeNumber(Math.max(sx, sy, sz) * 150, 1);
  }

  return { positions, colors, sizes, opacities };
}

// ── AQI 셰이더 머티리얼 ───────────────────────────────────
// 색조·채도·밝기 변환 + 균열 pulse를 버텍스/프래그먼트 셰이더로 구현
const vertexShader = `
  attribute float aSize;
  attribute vec3  aColor;
  attribute float aOpacity;

  uniform float uTime;
  uniform float uBreathSpeed;
  uniform float uPulseSize;
  uniform float uCrackOpen;
  uniform float uHueShift;
  uniform float uSatMul;
  uniform float uTreeSatMul;
  uniform float uBrightMul;
  uniform vec3  uBoundsMin;
  uniform vec3  uBoundsMax;
  uniform int   uNumBranches;
  uniform vec3  uBranchCenters[32];

  varying vec3  vColor;
  varying float vOpacity;

  // RGB → HSL
  vec3 rgb2hsl(vec3 c) {
    float maxC = max(c.r, max(c.g, c.b));
    float minC = min(c.r, min(c.g, c.b));
    float l = (maxC + minC) * 0.5;
    if (maxC == minC) return vec3(0.0, 0.0, l);
    float d = maxC - minC;
    float s = l > 0.5 ? d / (2.0 - maxC - minC) : d / (maxC + minC);
    float h;
    if (maxC == c.r)      h = (c.g - c.b) / d + (c.g < c.b ? 6.0 : 0.0);
    else if (maxC == c.g) h = (c.b - c.r) / d + 2.0;
    else                  h = (c.r - c.g) / d + 4.0;
    return vec3(h / 6.0, s, l);
  }

  float hue2rgb(float p, float q, float t) {
    if (t < 0.0) t += 1.0;
    if (t > 1.0) t -= 1.0;
    if (t < 1.0/6.0) return p + (q - p) * 6.0 * t;
    if (t < 1.0/2.0) return q;
    if (t < 2.0/3.0) return p + (q - p) * (2.0/3.0 - t) * 6.0;
    return p;
  }

  vec3 hsl2rgb(vec3 hsl) {
    float h = hsl.x, s = hsl.y, l = hsl.z;
    if (s == 0.0) return vec3(l);
    float q = l < 0.5 ? l * (1.0 + s) : l + s - l * s;
    float p = 2.0 * l - q;
    return vec3(hue2rgb(p,q,h+1.0/3.0), hue2rgb(p,q,h), hue2rgb(p,q,h-1.0/3.0));
  }

  void main() {
    // 나무 높이 기준 정규화
    float heightFrac = clamp((position.y - uBoundsMin.y) / (uBoundsMax.y - uBoundsMin.y), 0.0, 1.0);

    // 가장 가까운 브랜치 찾기
    float minDist = 99999.0;
    int nearestBranch = 0;
    for (int i = 0; i < 32; i++) {
      if (i >= uNumBranches) break;
      float d = distance(position, uBranchCenters[i]);
      if (d < minDist) {
        minDist = d;
        nearestBranch = i;
      }
    }

    // 브랜치별 고유 페이즈 — 각 가지가 다른 타이밍으로 호흡
    float branchPhase = float(nearestBranch) * 0.85;
    // 거리 기반 추가 오프셋 — 같은 가지 안에서도 미세하게 다른 타이밍
    float localPhase = position.x * 0.4 + position.z * 0.3;

    // 각 브랜치마다 완전히 다른 주파수 조합 — 진짜 불규칙한 호흡
    float t = uTime * uBreathSpeed*0.5;
    // branchPhase를 모든 주파수에 소수 배율로 곱해서 패턴이 절대 안 겹치게
    float s1 = sin(t * 0.037 + branchPhase * 2.39);
    float s2 = sin(t * 0.061 + branchPhase * 1.73) * 0.6;
    float s3 = sin(t * 0.023 + branchPhase * 3.17) * 0.4;
    float s4 = sin(t * 0.089 + branchPhase * 0.91 + localPhase) * 0.25;
    float s5 = sin(t * 0.017 + branchPhase * 4.31) * 0.35;
    float breathPhase = (s1 + s2 + s3 + s4 + s5) / 2.6;

    // 나무 중심에서 바깥으로 팽창/수축
    vec3 center = (uBoundsMin + uBoundsMax) * 0.5;
    vec3 dir = normalize(position - center + vec3(0.001));
    float expandAmt = breathPhase * uPulseSize * 0.04 * (0.5 + heightFrac * 0.5);
    vec3 breathPos = position + dir * expandAmt;

    vec4 mvPos = modelViewMatrix * vec4(breathPos, 1.0);

    float breathScale = 1.0 + breathPhase * uPulseSize * 0.012;

    // 균열
    float trunkFrac = 1.0 - clamp(heightFrac * 3.0, 0.0, 1.0);
    float crackPulse = sin(uTime * uBreathSpeed * 0.035) * uCrackOpen * trunkFrac;
    float crackScale = 1.0 + crackPulse * 0.04;
    float finalScale = breathScale * crackScale;

    // 색 변환
    vec3 hsl = rgb2hsl(aColor);
    hsl.x = fract(hsl.x + uHueShift / 360.0);
    hsl.y = clamp(hsl.y * uSatMul * uTreeSatMul, 0.0, 1.0);
    hsl.z = clamp(hsl.z * uBrightMul, 0.0, 1.0);
    vColor = hsl2rgb(hsl);

    // 기둥 부분은 항상 진하게 (+ AQI 나쁠 때 추가로 더 어두워짐)
    vColor *= (1.0 - trunkFrac * 0.1) * (1.0 - trunkFrac * uCrackOpen * 0.25);

    vOpacity = aOpacity;

    gl_Position = projectionMatrix * mvPos;
    gl_PointSize = aSize * finalScale * (2.0 / -mvPos.z);
  }
`;

const fragmentShader = `
  varying vec3  vColor;
  varying float vOpacity;

  void main() {
    // 원형 스플랫
    vec2 uv = gl_PointCoord - 0.5;
    float r = dot(uv, uv);
    if (r > 0.25) discard;
    float alpha = vOpacity * (1.0 - r * 4.0);
    gl_FragColor = vec4(vColor, alpha);
  }
`;

const staticColorShiftVertexShader = `
  attribute float aSize;
  attribute vec3  aColor;
  attribute float aOpacity;
  uniform float uHueShift;
  uniform float uSatMul;
  uniform float uBrightMul;
  uniform float uPointScale;
  varying vec3  vColor;
  varying float vOpacity;

  vec3 rgb2hsl(vec3 c) {
    float maxC = max(c.r, max(c.g, c.b));
    float minC = min(c.r, min(c.g, c.b));
    float l = (maxC + minC) * 0.5;
    if (maxC == minC) return vec3(0.0, 0.0, l);
    float d = maxC - minC;
    float s = l > 0.5 ? d / (2.0 - maxC - minC) : d / (maxC + minC);
    float h;
    if (maxC == c.r)      h = (c.g - c.b) / d + (c.g < c.b ? 6.0 : 0.0);
    else if (maxC == c.g) h = (c.b - c.r) / d + 2.0;
    else                  h = (c.r - c.g) / d + 4.0;
    return vec3(h / 6.0, s, l);
  }

  float hue2rgb(float p, float q, float t) {
    if (t < 0.0) t += 1.0;
    if (t > 1.0) t -= 1.0;
    if (t < 1.0/6.0) return p + (q - p) * 6.0 * t;
    if (t < 1.0/2.0) return q;
    if (t < 2.0/3.0) return p + (q - p) * (2.0/3.0 - t) * 6.0;
    return p;
  }

  vec3 hsl2rgb(vec3 hsl) {
    float h = hsl.x, s = hsl.y, l = hsl.z;
    if (s == 0.0) return vec3(l);
    float q = l < 0.5 ? l * (1.0 + s) : l + s - l * s;
    float p = 2.0 * l - q;
    return vec3(hue2rgb(p,q,h+1.0/3.0), hue2rgb(p,q,h), hue2rgb(p,q,h-1.0/3.0));
  }

  void main() {
    vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
    vec3 hsl = rgb2hsl(aColor);
    hsl.x = fract(hsl.x + uHueShift / 360.0);
    hsl.y = clamp(hsl.y * uSatMul, 0.0, 1.0);
    hsl.z = clamp(hsl.z * uBrightMul, 0.0, 1.0);
    vColor = hsl2rgb(hsl);
    vOpacity = aOpacity;
    gl_Position = projectionMatrix * mvPos;
    gl_PointSize = aSize * uPointScale * (1.5 / -mvPos.z);
  }
`;

// ── 파티클 오버레이 (산소/오염 입자) ─────────────────────
function createParticleSystem() {
  const count = 200;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const sz  = new Float32Array(count);
  const life = new Float32Array(count);
  const vel  = [];

  for (let i = 0; i < count; i++) {
    life[i] = Math.random();
    vel.push({ vx: (Math.random()-0.5)*0.004, vy: Math.random()*0.006+0.002, vz: (Math.random()-0.5)*0.004 });
    pos[i*3]   = (Math.random()-0.5)*1.2;
    pos[i*3+1] = Math.random()*1.5 - 0.2;
    pos[i*3+2] = (Math.random()-0.5)*1.2;
    sz[i] = 3 + Math.random()*1.5;
  }

  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('size',     new THREE.BufferAttribute(sz,  1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 3.2);

  const mat = new THREE.ShaderMaterial({
    uniforms: { uStyle: { value: 0 } },
    vertexShader: `
      attribute float size;
      attribute vec3 aColor;
      varying vec3 vCol;
      void main() {
        vCol = aColor;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = size * (20.0 / -mv.z);
      }
    `,
    fragmentShader: `
      varying vec3 vCol;
      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float r = dot(uv, uv);
        if (r > 0.25) discard;
        gl_FragColor = vec4(vCol, (0.25 - r) * 4.0 * 0.6);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexColors: true,
  });

  const mesh = new THREE.Points(geo, mat);

function updateParticles(ps, style, dt) {
  const isGood = style.crackOpen < 0.3;
  for (let i = 0; i < ps.count; i++) {
    ps.life[i] += dt * (0.3 + style.breathSpeed * 0.4);
    if (ps.life[i] > 1) {
      ps.life[i] = 0;
      ps.pos[i*3]   = (Math.random()-0.5)*1.2;
      ps.pos[i*3+1] = isGood ? -0.1 + Math.random()*0.3 : Math.random()*1.5 - 0.2;
      ps.pos[i*3+2] = (Math.random()-0.5)*1.2;
      ps.vel[i].vx = (Math.random()-0.5)*0.004;
      ps.vel[i].vy = isGood ? Math.random()*0.006+0.002 : (Math.random()-0.5)*0.002;
      ps.vel[i].vz = (Math.random()-0.5)*0.004;
    }
    ps.pos[i*3]   += ps.vel[i].vx;
    ps.pos[i*3+1] += ps.vel[i].vy;
    ps.pos[i*3+2] += ps.vel[i].vz;

    const alpha = Math.sin(ps.life[i] * Math.PI) * 0.8;
    if (isGood) {
      ps.col[i*3] = 0.4 * alpha; ps.col[i*3+1] = 1.5 * alpha; ps.col[i*3+2] = 0.5 * alpha;
    } else if (style.crackOpen < 0.6) {
      ps.col[i*3] = 0.7 * alpha; ps.col[i*3+1] = 0.45 * alpha; ps.col[i*3+2] = 0.1 * alpha;
    } else {
      ps.col[i*3] = 0.5 * alpha; ps.col[i*3+1] = 0.1 * alpha; ps.col[i*3+2] = 0.1 * alpha;
    }
  }
  ps.mesh.geometry.attributes.position.needsUpdate = true;
  ps.mesh.geometry.attributes.aColor.needsUpdate = true;
}

// ── 골격 기반 빛 흐름 ──────────────────────────────────────
function createTrunkFlow(cx, cy, cz, sc) {
  // 메인 나무와 동일한 정규화 (Y축 반전)
  function toWorld(p) {
    return {
      x:  (p.x - cx) * sc,
      y: -(p.y - cy) * sc,
      z:  (p.z - cz) * sc,
    };
  }

  // 각 브랜치 중심선 변환
  const BRANCHES = BRANCH_DATA.map(br => {
    let points = br.points.map(toWorld);
    // 첫 포인트가 마지막보다 y가 높으면 역순 (끝→뿌리 방향 수정)
    if (points[0].y < points[points.length - 1].y) {
      points = points.reverse();
    }
    return { name: br.name, points };
  });

  const group = new THREE.Group();
  const branchLines = [];

  // 각 브랜치마다 vertexColors 선 — 각 점의 색을 개별 제어
  BRANCHES.forEach((br, bi) => {
    const jPts = br.points.map(p => new THREE.Vector3(p.x, p.y, p.z));
    const curve = new THREE.CatmullRomCurve3(jPts);
    const N = jPts.length * 6;
    const smoothPts = curve.getPoints(N);

    // 원본 위치 저장 (호흡 애니메이션 기준점)
    const origPos = smoothPts.map(p => p.clone());
    const posArr = new Float32Array(smoothPts.length * 3);
    const colArr = new Float32Array(smoothPts.length * 3);

    const geo = new THREE.BufferGeometry();
    // 위치도 동적으로 업데이트할 수 있도록 BufferAttribute로
    for (let i = 0; i < smoothPts.length; i++) {
      posArr[i*3]   = smoothPts[i].x;
      posArr[i*3+1] = smoothPts[i].y;
      posArr[i*3+2] = smoothPts[i].z;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    geo.setAttribute('color',    new THREE.BufferAttribute(colArr, 3));
    geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 3.2);

    const mat = new THREE.LineBasicMaterial({
      vertexColors: true,
      transparent: true,
      opacity: 0.3,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const line = new THREE.Line(geo, mat);
    group.add(line);

    // 보조선
    for (let s = 1; s < 3; s++) {
      const jPts2 = br.points.map(p => new THREE.Vector3(
        p.x + (Math.random()-0.5)*0.02,
        p.y + (Math.random()-0.5)*0.02,
        p.z + (Math.random()-0.5)*0.02,
      ));
      const curve2 = new THREE.CatmullRomCurve3(jPts2);
      const sPts2 = curve2.getPoints(N);
      const origPos2 = sPts2.map(p => p.clone());
      const posArr2 = new Float32Array(sPts2.length * 3);
      const colArr2 = new Float32Array(sPts2.length * 3);
      for (let i = 0; i < sPts2.length; i++) {
        posArr2[i*3]   = sPts2[i].x;
        posArr2[i*3+1] = sPts2[i].y;
        posArr2[i*3+2] = sPts2[i].z;
      }
      const geo2 = new THREE.BufferGeometry();
      geo2.setAttribute('position', new THREE.BufferAttribute(posArr2, 3));
      geo2.setAttribute('color',    new THREE.BufferAttribute(colArr2, 3));
      geo2.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 3.2);
      const mat2 = new THREE.LineBasicMaterial({
        vertexColors: true, transparent: true, opacity: 0.15,
        blending: THREE.AdditiveBlending, depthWrite: false,
      });
      group.add(new THREE.Line(geo2, mat2));
      const velArr2 = new Float32Array(sPts2.length * 3); 
      branchLines.push({ colArr: colArr2, posArr: posArr2, origPos: origPos2, velArr: velArr2, geo: geo2, n: sPts2.length, phase: bi + s * 0.3, branchIdx: bi });
    }

    const velArr = new Float32Array(smoothPts.length * 3);
    branchLines.push({ colArr, posArr, origPos, velArr, geo, n: smoothPts.length, phase: bi * 0.7, branchIdx: bi });
  });


  // ── 웨이브 스윕 파티클 ──
  // 각 브랜치마다 밀집된 파티클 구간이 처음부터 끝까지 흘러가는 방식
  const PARTICLES_PER_BRANCH = 40;
  const TOTAL = BRANCHES.length * PARTICLES_PER_BRANCH;
  const flowPos  = new Float32Array(TOTAL * 3);
  const flowCol  = new Float32Array(TOTAL * 3);
  const flowSize = new Float32Array(TOTAL);

  // 각 브랜치마다 wave head 위치 (0→1)
  const waveHeads = BRANCHES.map((_, i) => ({
    head: -0.2,           // 현재 웨이브 선두 위치

  const flowGeo = new THREE.BufferGeometry();

  flowGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 3.2);

  const flowMat = new THREE.ShaderMaterial({
    vertexShader: `
      attribute float aSize;
      attribute vec3 aCol;
      varying vec3 vCol;
      void main() {
        vCol = aCol;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * (8.0 / -mv.z);

    fragmentShader: `

      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float r = dot(uv, uv);

        gl_FragColor = vec4(vCol, a);
      }

    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });
  //group.add(new THREE.Points(flowGeo, flowMat));
  

  function update(elapsed, style) {
    const cr = style.crackOpen;
    const spd = style.breathSpeed;
    const pulse = 0.5 + Math.sin(elapsed * spd * 1.5) * 0.5;

    // 라인 웨이브 — vertexColors로 각 점 밝기 제어
    waveHeads.forEach((w, wi) => {
      w.head += w.speed * spd;
      if (w.head > 1.2) w.head = -0.2;
    });

    branchLines.forEach(({ colArr, posArr, origPos, velArr, geo, n, phase, branchIdx }) => {
      const wi = Math.floor(phase) % waveHeads.length;
      const w = waveHeads[wi];

      // 브랜치별 독립 호흡 페이즈 (스플랫과 동일한 공식)
      const bp = branchIdx * 0.85;
      const s1 = Math.sin(elapsed * spd * 0.020 + bp * 2.39);
      const s2 = Math.sin(elapsed * spd * 0.041 + bp * 1.73) * 0.6;
      const s3 = Math.sin(elapsed * spd * 0.015 + bp * 3.17) * 0.4;
      const s5 = Math.sin(elapsed * spd * 0.010 + bp * 4.31) * 0.35;
      const breathAmt = (s1 + s2 + s3 + s5) / 2.6;

      for (let i = 0; i < n; i++) {
        const t = i / (n - 1);

        // 위치 흔들림 — 원본에서 수직 방향으로 미세하게 흔들
        const orig = origPos[i];
        const ptPhase = orig.x * 0.7 + orig.y * 1.1 + orig.z * 0.5;
        const t2 = elapsed * spd;

        const nx = Math.sin(t2 * 0.03 + ptPhase * 1.2) * 0.0003;
        const ny = Math.sin(t2 * 0.04 + ptPhase * 0.9) * 0.0002;
        const nz = Math.cos(t2 * 0.025 + ptPhase * 1.1) * 0.0003;

        velArr[i*3]   += nx;
        velArr[i*3+1] += ny;
        velArr[i*3+2] += nz;

        // 강한 스프링으로 orig 위치 유지
        velArr[i*3]   += (orig.x - posArr[i*3])   * 0.08;
        velArr[i*3+1] += (orig.y - posArr[i*3+1]) * 0.08;
        velArr[i*3+2] += (orig.z - posArr[i*3+2]) * 0.08;

        velArr[i*3]   *= 0.75;
        velArr[i*3+1] *= 0.75;
        velArr[i*3+2] *= 0.75;

        posArr[i*3]   += velArr[i*3];
        posArr[i*3+1] += velArr[i*3+1];
        posArr[i*3+2] += velArr[i*3+2];

        // 색 웨이브
        const dist = Math.abs(t - w.head);
        const inWave = Math.max(0, 1.0 - dist / w.width);
        const trail = t < w.head ? Math.max(0, 1.0 - (w.head - t) / (w.width * 2)) : 0;
        const bright = Math.pow(inWave, 1.5) + trail * 0.3;

        const peak = Math.pow(bright, 1.8);
        // 공통 AQI 색상 — cr 값으로 현재 단계 계산
        const aqiStep = style.aqi || 1;
        const [lr, lg, lb] = aqiToRGB(aqiStep);
        // 채도 낮추기 — 회색(평균값)과 혼합
        const gray = (lr + lg + lb) / 3;
        const sat = 0.5; // 0 = 완전 무채색, 1 = 원본, 0.5 = 절반
        colArr[i*3]   = (lr * sat + gray * (1 - sat)) * peak;
        colArr[i*3+1] = (lg * sat + gray * (1 - sat)) * peak;
        colArr[i*3+2] = (lb * sat + gray * (1 - sat)) * peak;
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.color.needsUpdate = true;
    });

    // 웨이브 헤드 이동
    waveHeads.forEach(w => {
      w.head += w.speed * spd;
      if (w.head > 1.15) w.head = -0.1; // 끝나면 다시 시작
    });

    // 파티클 위치 업데이트
    // BRANCHES.forEach((br, bi) => {

    //     // 웨이브 선두가 가장 밝고 뒤로 갈수록 페이드

  }

// Particle-only tuning
// 1.0 = current particle breath timing, 0.7 = slower inhale/exhale attachment.
const PARTICLE_BREATH_TIME_SCALE = 0.7;
const LEAF_ATTACH_RATIO = 0.58;
const LEAF_ATTACH_IN_SPEED = 0.008;
const LEAF_ATTACH_OUT_SPEED = 0.005;
const LEAF_ATTACH_PULL = 0.0017;
const LEAF_ATTACH_DIRECT_EASE = 0.0038;
const FREE_PARTICLE_FLOW = 1.0;

let leafParticleTargets = [];
let leafParticleCenter = new THREE.Vector3(0, 0.5, 0);

function rebuildLeafParticleTargets(lPos) {
  leafParticleTargets = [];
  if (!lPos || lPos.length < 3) return;

  const stride = Math.max(3, Math.floor((lPos.length / 3) / 5500) * 3);
  const center = new THREE.Vector3();

  for (let i = 0; i < lPos.length; i += stride) {
    if (!Number.isFinite(lPos[i]) || !Number.isFinite(lPos[i + 1]) || !Number.isFinite(lPos[i + 2])) continue;
    const target = new THREE.Vector3(lPos[i], lPos[i + 1], lPos[i + 2]);
    leafParticleTargets.push(target);
    center.add(target);
  }

  if (leafParticleTargets.length) {
    center.multiplyScalar(1 / leafParticleTargets.length);
    leafParticleCenter.copy(center);
  }
}

function sampleLeafParticleTarget() {
  if (!leafParticleTargets.length) {
    return new THREE.Vector3(
      (Math.random() - 0.5) * 0.9,
      0.35 + Math.random() * 0.8,
      (Math.random() - 0.5) * 0.9
    );
  }
  return leafParticleTargets[Math.floor(Math.random() * leafParticleTargets.length)].clone();
}

function smootherStep(edge0, edge1, x) {
  const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
  return t * t * t * (t * (t * 6 - 15) + 10);
}

function createSphereParticles() {
  const COUNT = 15000;
  const RADIUS = 1.3;

  const positions = new Float32Array(COUNT * 3);
  const colors    = new Float32Array(COUNT * 3);
  const sizes     = new Float32Array(COUNT);

  const particleData = [];
  for (let i = 0; i < COUNT; i++) {
    // 구형 랜덤 분포 — 중심에서 가우시안 분포로 퍼짐
    const u = Math.random();
    const v = Math.random();
    const theta = 2 * Math.PI * u;
    // 상단(phi 작은 쪽)에 더 밀집
    const phi = Math.acos(1 - Math.pow(Math.random(), 0.4));
    // 노이즈로 불규칙한 반지름
    const noiseR = Math.sin(phi * 3.7 + theta * 2.3) * 0.3
                + Math.sin(phi * 7.1 + theta * 4.9) * 0.15
                + Math.sin(theta * 3.3) * 0.1;
    const r = RADIUS * (Math.pow(Math.random(), 0.5) + noiseR * 0.4);

    const x = r * Math.sin(phi) * Math.cos(theta);
    const y = r * Math.cos(phi);
    const z = r * Math.sin(phi) * Math.sin(theta);

    const leafTarget = sampleLeafParticleTarget();
    const normal = leafTarget.clone().sub(leafParticleCenter);
    if (normal.lengthSq() < 0.0001) normal.set(Math.random() - 0.5, 0.2, Math.random() - 0.5);
    normal.normalize();

    const tangentA = new THREE.Vector3(-normal.z, 0, normal.x);
    if (tangentA.lengthSq() < 0.0001) tangentA.set(1, 0, 0);
    tangentA.normalize();
    const tangentB = new THREE.Vector3().crossVectors(normal, tangentA).normalize();

    const canAttach = Math.random() < LEAF_ATTACH_RATIO;
    const attachMax = canAttach ? 0.25 + Math.random() * 0.55 : 0.0;

    particleData.push({
      x, y, z,
      // 각 파티클마다 독립적인 드리프트 방향과 속도
      vx: (Math.random() - 0.5) * 0.0008,

      // 원래 위치로 돌아오려는 힘
      ox: x, oy: y, oz: z,
      attach: 0,
      attachMax,
      leafTarget,
      normal,
      tangentA,
      tangentB,
      leafOffset: 0.012 + Math.random() * 0.055,
      reactionPhase: Math.random() * Math.PI * 2,
      slidePhase: Math.random() * Math.PI * 2,
      driftScale: 0.7 + Math.random() * 0.7,
      // 개별 깜빡임 페이즈
      flickerPhase: Math.random() * Math.PI * 2,
      flickerSpeed: 0.3 + Math.random() * 0.8,
      // PM2.5(0) vs PM10(1) — 절반씩, 크기 다르게
      pmType: i < COUNT * 0.5 ? 0 : 1,
      size: i < COUNT * 0.5
        ? 0.15 + Math.random() * 0.25   // PM2.5: 더 작고 촘촘
        : 0.25 + Math.random() * 0.4,   // PM10: 더 크고 성김
    });

    positions[i*3]   = x;
    positions[i*3+1] = y;
    positions[i*3+2] = z;
    sizes[i] = particleData[i].size;
    // 초기 색상 설정
    colors[i*3]   = 0.2;
    colors[i*3+1] = 0.3;
    colors[i*3+2] = 0.35;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aCol',     new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(sizes, 1));
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 3.2);

  const mat = new THREE.ShaderMaterial({
    vertexShader: `
      attribute float aSize;
      attribute vec3 aCol;
      varying vec3 vCol;
      void main() {
        vCol = aCol;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * (18.0 / -mv.z);
      }
    `,
    fragmentShader: `
      varying vec3 vCol;
      void main() {
        vec2 uv = gl_PointCoord - 0.5;
        float r = dot(uv, uv);
        if (r > 0.25) discard;
        // 부드러운 원형 페이드
        float a = smoothstep(0.25, 0.0, r);
        gl_FragColor = vec4(vCol, a * 1.5);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  const mesh = new THREE.Points(geo, mat);
  mesh.position.y = 0.1;

  function update(elapsed, style) {
    const cr = style.crackOpen;

    // 이파리 셰이더와 동일한 호흡 페이즈 계산
    const spd = style.breathSpeed;
    const t2 = elapsed * 60 * spd * 0.5 * PARTICLE_BREATH_TIME_SCALE;
    const b1 = Math.sin(t2 * 0.041);
    const b2 = Math.sin(t2 * 0.073) * 0.7;
    const b3 = Math.sin(t2 * 0.019) * 0.5;
    const breathPhase = (b1 + b2 + b3) / 2.2; // -1 ~ 1

    const inhaleStrength = smootherStep(0.04, 0.9, -breathPhase);
    const exhaleStrength = smootherStep(0.08, 0.85, breathPhase);

    for (let i = 0; i < COUNT; i++) {
      const p = particleData[i];

      const reactivity = 0.28 + 0.72 * smootherStep(
        -0.8,
        0.95,
        Math.sin(p.reactionPhase + elapsed * 0.18 + p.ox * 0.7)
      );
      const targetAttach = p.attachMax * inhaleStrength * reactivity;
      const releaseAttach = p.attachMax * 0.10 * exhaleStrength;
      const desiredAttach = Math.max(targetAttach, releaseAttach);
      const attachEase = desiredAttach > p.attach ? LEAF_ATTACH_IN_SPEED : LEAF_ATTACH_OUT_SPEED;
      p.attach += (desiredAttach - p.attach) * attachEase;

      // 일반 노이즈 흐름
      const t = elapsed * 0.15;
      const nx = Math.sin(p.ox * 1.3 + t) * Math.cos(p.oz * 0.9 + t * 0.7);
      const ny = Math.sin(p.oy * 1.1 + t * 0.8) * 0.5;
      const nz = Math.cos(p.ox * 0.8 + t * 1.1) * Math.sin(p.oy * 1.2 + t * 0.6);

      const freeFlow = FREE_PARTICLE_FLOW * p.driftScale * (1.0 - p.attach * 0.45);
      p.vx += nx * 0.00015 * freeFlow;
      p.vy += ny * 0.0001 * freeFlow;
      p.vz += nz * 0.00015 * freeFlow;

      // 원점으로 돌아오는 힘 (구 형태 유지)
      const d = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z) + 0.001;
      const pull = (d - RADIUS * 0.7) * 0.0003 * (1.0 - p.attach * 0.55);
      p.vx -= (p.x / d) * pull;
      p.vy -= (p.y / d) * pull;
      p.vz -= (p.z / d) * pull;

      if (p.attach > 0.002) {
        const slide = elapsed * (0.55 + p.driftScale * 0.25) + p.slidePhase;
        const slideA = Math.sin(slide) * (0.012 + p.leafOffset * 0.25);
        const slideB = Math.cos(slide * 0.73 + p.reactionPhase) * (0.010 + p.leafOffset * 0.18);
        const breatheLift = Math.sin(t2 * 0.041 + p.reactionPhase) * 0.018 * style.pulseSize;

        const tx = p.leafTarget.x + p.normal.x * (p.leafOffset + breatheLift)
                 + p.tangentA.x * slideA + p.tangentB.x * slideB;
        const ty = p.leafTarget.y + p.normal.y * (p.leafOffset + breatheLift)
                 + p.tangentA.y * slideA + p.tangentB.y * slideB;
        const tz = p.leafTarget.z + p.normal.z * (p.leafOffset + breatheLift)
                 + p.tangentA.z * slideA + p.tangentB.z * slideB;

        p.vx += (tx - p.x) * p.attach * LEAF_ATTACH_PULL;
        p.vy += (ty - p.y) * p.attach * LEAF_ATTACH_PULL;
        p.vz += (tz - p.z) * p.attach * LEAF_ATTACH_PULL;

        p.x += (tx - p.x) * p.attach * LEAF_ATTACH_DIRECT_EASE;
        p.y += (ty - p.y) * p.attach * LEAF_ATTACH_DIRECT_EASE;
        p.z += (tz - p.z) * p.attach * LEAF_ATTACH_DIRECT_EASE;
      }

      if (exhaleStrength > 0.03) {
        const release = exhaleStrength * (1.0 - p.attach * 0.35);
        p.vx += (p.ox - p.x) * release * 0.0005;
        p.vy += (p.oy - p.y) * release * 0.0005;
        p.vz += (p.oz - p.z) * release * 0.0005;
      }

      const damping = 0.982 - p.attach * 0.052;
      p.vx *= damping;
      p.vy *= damping;
      p.vz *= damping;

      const maxSpeed = 0.0045 + cr * 0.0015;
      const spLen = Math.sqrt(p.vx*p.vx + p.vy*p.vy + p.vz*p.vz);
      if (spLen > maxSpeed) {
        p.vx = (p.vx / spLen) * maxSpeed;
        p.vy = (p.vy / spLen) * maxSpeed;
        p.vz = (p.vz / spLen) * maxSpeed;
      }

      p.x += p.vx;
      p.y += p.vy;
      p.z += p.vz;

      positions[i*3]   = p.x;
      positions[i*3+1] = p.y;
      positions[i*3+2] = p.z;

      // 중심에서 거리 기반 밝기
      const dist = Math.sqrt(p.x*p.x + p.y*p.y + p.z*p.z);
      const radialBright = Math.max(0.18, 1.0 - dist / (RADIUS * 1.35));
      const flicker = 0.7 + Math.sin(elapsed * p.flickerSpeed + p.flickerPhase) * 0.3;
      const b = radialBright * flicker * (1.35 + p.attach * 0.65);

      // 브랜치와 동일한 aqiToRGB 기반 색 + 채도 조절
      const aqi = globalPM25AQI; // 단일 DAQI 기준
      const [rc, gc, bc] = aqiToRGB(aqi);
      const grayP = (rc + gc + bc) / 3;
      const satP = 0.5; // 채도 조절
      colors[i*3]   = (rc * satP + grayP * (1 - satP)) * b;
      colors[i*3+1] = (gc * satP + grayP * (1 - satP)) * b;
      colors[i*3+2] = (bc * satP + grayP * (1 - satP)) * b;
    }

    geo.attributes.position.needsUpdate = true;
    geo.attributes.aCol.needsUpdate = true;
  }

  return { mesh, update };
}

function updateTimelinePosition() {
  const min = Number(dateSlider.min);
  const max = Number(dateSlider.max);
  const value = Number(dateSlider.value);
  const steps = Math.max(1, max - min);
  const width = sliderWrap.getBoundingClientRect().width || window.innerWidth;
  const step = clamp(width / 9.8, 32, 44);
  const progress = steps ? ((value - min) / steps) * 100 : 0;
  dialTargetOffset = (steps / 2 - (value - min)) * step;
  aqiPanel.style.setProperty('--dial-step', `${step}px`);
  aqiPanel.style.setProperty('--dial-width', `${steps * step}px`);
  aqiPanel.style.setProperty('--timeline-progress', `${progress}%`);
  startDialAnim();
}

function futureValueToAQI(value) {
  const span = FUTURE_WORST_VALUE - FUTURE_BEST_VALUE;
  if (!span) return 1;
  const t = clamp((value - FUTURE_BEST_VALUE) / span, 0, 1);
  return Math.round(1 + t * 9);
}

function buildFutureTimeline(scenarioKey) {
  const scenario = FUTURE_SCENARIOS[scenarioKey] || FUTURE_SCENARIOS.good;
  return scenario.series.filter(([year]) => year % 10 === 0).map(([year, value]) => {
    const aqi = futureValueToAQI(value);
    return {
      type: 'future',
      scenario: scenarioKey,
      year,
      value,
      dateKey: `${year}-01-01`,
      aqi,
      pm25AQI: aqi,
      pm10AQI: aqi,
      unavailable: false,
      sampleCount: 0,
    };
  });
}

async function init() {
  try {
    loadingText.textContent = 'LOADING SCENE';

    // Load the trunk/base scan and leaves together so the first visible render is complete.
    const [buffer, leavesBuffer] = await Promise.all([
      loadPLY(PLY_FILE, p => {
        loadingBar.style.width = Math.round(p * 100) + '%';
      }),
      loadPLY(LEAVES_FILE, () => null).catch(() => null),
    ]);

    loadingText.textContent = 'BUILDING SPLATS';
    loadingBar.style.width = '100%';

    const header = parsePLYHeader(buffer);
    const { positions, colors, sizes, opacities } = buildSplatGeometry(buffer, header);

    // 바운딩 박스
    let minY = Infinity, maxY = -Infinity, minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (let i = 0; i < positions.length; i += 3) {
      minX = Math.min(minX, positions[i]);   maxX = Math.max(maxX, positions[i]);
      minY = Math.min(minY, positions[i+1]); maxY = Math.max(maxY, positions[i+1]);
      minZ = Math.min(minZ, positions[i+2]); maxZ = Math.max(maxZ, positions[i+2]);
    }
    const centerX = (minX+maxX)/2, centerY = (minY+maxY)/2, centerZ = (minZ+maxZ)/2;
    const spanMax = Math.max(maxX-minX, maxY-minY, maxZ-minZ);
    const scale = 2.0 / spanMax;

    // 정규화 (Y축 반전)
    for (let i = 0; i < positions.length; i += 3) {
      positions[i]   = (positions[i]   - centerX) * scale;
      positions[i+1] = -(positions[i+1] - centerY) * scale;
      positions[i+2] = (positions[i+2] - centerZ) * scale;
    }
    const bMin = new THREE.Vector3((minX-centerX)*scale, -(maxY-centerY)*scale, (minZ-centerZ)*scale);
    const bMax = new THREE.Vector3((maxX-centerX)*scale, -(minY-centerY)*scale, (maxZ-centerZ)*scale);
    setRotationTargetFromModelCenter(positions);

    // 지오메트리
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geo.setAttribute('aColor',   new THREE.BufferAttribute(colors,    3));
    geo.setAttribute('aSize',    new THREE.BufferAttribute(sizes,     1));
    geo.setAttribute('aOpacity', new THREE.BufferAttribute(opacities, 1));
    geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 3.2);

    splatMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime:       { value: 0 },
        uBreathSpeed:{ value: 1.0 },
        uPulseSize:  { value: 0.18 },
        uCrackOpen:  { value: 0.0 },
        uHueShift:   { value: 0.0 },
        uSatMul:     { value: 1.0 },
        uTreeSatMul: { value: 1.0 },
        uBrightMul:  { value: 1.4 },
        uBoundsMin:  { value: bMin },
        uBoundsMax:  { value: bMax },
        uNumBranches: { value: 0 },
        uBranchCenters: { value: new Array(32).fill(null).map(() => new THREE.Vector3()) },
      },
      vertexShader,
      fragmentShader,
      transparent: true,
      depthWrite: false,
      blending: THREE.NormalBlending,
    });

    const points = new THREE.Points(geo, splatMaterial);
    rootGroup.add(points);

    loadingText.textContent = 'RENDERING TREE';

    // ── 이파리 PLY 처리 ──
    try {
      if (!leavesBuffer) throw new Error('leaves_only asset unavailable');
      const leavesHeader = parsePLYHeader(leavesBuffer);
      const { positions: lPos, colors: lCol, sizes: lSiz, opacities: lOpa } = buildSplatGeometry(leavesBuffer, leavesHeader);

      // 이파리도 동일한 정규화 적용
      for (let i = 0; i < lPos.length; i += 3) {
        lPos[i]   = (lPos[i]   - centerX) * scale;
        lPos[i+1] = -(lPos[i+1] - centerY) * scale;
        lPos[i+2] = (lPos[i+2] - centerZ) * scale;
      }
      rebuildLeafParticleTargets(lPos);

      const lGeo = new THREE.BufferGeometry();
      lGeo.setAttribute('position', new THREE.BufferAttribute(lPos, 3));
      lGeo.setAttribute('aColor',   new THREE.BufferAttribute(lCol, 3));
      lGeo.setAttribute('aSize',    new THREE.BufferAttribute(lSiz, 1));
      lGeo.setAttribute('aOpacity', new THREE.BufferAttribute(lOpa, 1));
      lGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 3.2);

      // 이파리 전용 셰이더 — 더 드라마틱한 호흡, 위치 기반 유기적 페이즈
      const leavesVertexShader = `
        attribute float aSize;
        attribute vec3  aColor;
        attribute float aOpacity;
        uniform float uTime;
        uniform float uBreathSpeed;
        uniform float uPulseSize;
        uniform float uLeafContract;
        uniform float uHueShift;
        uniform float uSatMul;
        uniform float uBrightMul;
        uniform vec3  uBoundsMin;
        uniform vec3  uBoundsMax;
        varying vec3  vColor;
        varying float vOpacity;

        vec3 rgb2hsl(vec3 c) {
          float maxC = max(c.r, max(c.g, c.b));
          float minC = min(c.r, min(c.g, c.b));
          float l = (maxC + minC) * 0.5;
          if (maxC == minC) return vec3(0.0, 0.0, l);
          float d = maxC - minC;
          float s = l > 0.5 ? d / (2.0 - maxC - minC) : d / (maxC + minC);
          float h;
          if (maxC == c.r)      h = (c.g - c.b) / d + (c.g < c.b ? 6.0 : 0.0);
          else if (maxC == c.g) h = (c.b - c.r) / d + 2.0;
          else                  h = (c.r - c.g) / d + 4.0;
          return vec3(h / 6.0, s, l);
        }
        float hue2rgb(float p, float q, float t) {
          if (t < 0.0) t += 1.0;
          if (t > 1.0) t -= 1.0;
          if (t < 1.0/6.0) return p + (q - p) * 6.0 * t;
          if (t < 1.0/2.0) return q;
          if (t < 2.0/3.0) return p + (q - p) * (2.0/3.0 - t) * 6.0;
          return p;
        }
        vec3 hsl2rgb(vec3 hsl) {
          float h = hsl.x, s = hsl.y, l = hsl.z;
          if (s == 0.0) return vec3(l);
          float q = l < 0.5 ? l * (1.0 + s) : l + s - l * s;
          float p = 2.0 * l - q;
          return vec3(hue2rgb(p,q,h+1.0/3.0), hue2rgb(p,q,h), hue2rgb(p,q,h-1.0/3.0));
        }

        void main() {
          float heightFrac = clamp((position.y - uBoundsMin.y) / (uBoundsMax.y - uBoundsMin.y), 0.0, 1.0);

          // 위치 기반 고유 페이즈 — 각 이파리마다 완전히 다른 타이밍
          float leafPhase = position.x * 1.7 + position.y * 2.3 + position.z * 1.1;
          float t = uTime * uBreathSpeed * 0.5;

          // 여러 주파수 조합으로 불규칙한 호흡
          float b1 = sin(t * 0.041 + leafPhase * 0.8);
          float b2 = sin(t * 0.073 + leafPhase * 1.3) * 0.7;
          float b3 = sin(t * 0.019 + leafPhase * 2.1) * 0.5;
          float b4 = sin(t * 0.097 + leafPhase * 0.5) * 0.3;
          float breathPhase = (b1 + b2 + b3 + b4) / 2.5;

          // 나무 중심에서 바깥으로 — 이파리는 훨씬 크게 팽창
          vec3 center = (uBoundsMin + uBoundsMax) * 0.5;
          vec3 dir = normalize(position - center + vec3(0.001));
          vec3 basePos = position - dir * uLeafContract * (0.35 + heightFrac * 0.65);
          // 상단 이파리일수록 더 크게 움직임
          float leafAmp = uPulseSize * 0.12 * (0.4 + heightFrac * 0.6);
          vec3 breathPos = basePos + dir * breathPhase * leafAmp;

          // 추가로 옆으로도 살랑거림
          breathPos.x += sin(t * 0.053 + leafPhase * 1.4) * uPulseSize * 0.04;
          breathPos.z += cos(t * 0.047 + leafPhase * 1.6) * uPulseSize * 0.04;

          vec4 mvPos = modelViewMatrix * vec4(breathPos, 1.0);

          // 색 변환
          vec3 hsl = rgb2hsl(aColor);
          hsl.x = fract(hsl.x + uHueShift / 360.0);
          hsl.y = clamp(hsl.y * uSatMul, 0.0, 1.0);
          hsl.z = clamp(hsl.z * uBrightMul, 0.0, 1.0);
          vColor = hsl2rgb(hsl);

          vOpacity = aOpacity;
          gl_Position = projectionMatrix * mvPos;
          gl_PointSize = aSize * (1.0 + breathPhase * uPulseSize * 0.18) * (1.5 / -mvPos.z);
        }
      `;

      const leavesFragShader = `
        varying vec3  vColor;
        varying float vOpacity;
        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float r = dot(uv, uv);
          if (r > 0.25) discard;
          float alpha = vOpacity * (1.0 - r * 4.0);
          gl_FragColor = vec4(vColor, alpha);
        }
      `;

      leavesMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uTime:       { value: 0 },
          uBreathSpeed:{ value: 1.0 },
          uPulseSize:  { value: 0.18 },
          uLeafContract: { value: 0.0 },
          uHueShift:   { value: 0.0 },
          uSatMul:     { value: 1.0 },
          uBrightMul:  { value: 1.0 },
          uBoundsMin:  { value: bMin },
          uBoundsMax:  { value: bMax },
        },
        vertexShader: leavesVertexShader,
        fragmentShader: leavesFragShader,
        transparent: true,
        depthWrite: false,
        blending: THREE.NormalBlending,
      });

      const leavesPoints = new THREE.Points(lGeo, leavesMaterial);
      rootGroup.add(leavesPoints);
      console.log('Leaves loaded');
    } catch(e) {
      console.log('Leaves file not found; skipping:', e.message);
    }

    // 브랜치 대표점 계산 → 셰이더 uniform에 설정
    const branchCenters = BRANCH_DATA.map(br => {
      const mid = br.points[Math.floor(br.points.length * 0.5)];
      return new THREE.Vector3(
        (mid.x - centerX) * scale,
        -(mid.y - centerY) * scale,
        (mid.z - centerZ) * scale,
      );
    });
    const n = Math.min(branchCenters.length, 32);
    splatMaterial.uniforms.uNumBranches.value = n;
    for (let i = 0; i < n; i++) {
      splatMaterial.uniforms.uBranchCenters.value[i].copy(branchCenters[i]);
    }
    console.log(`Branch centers assigned: ${n}`);

    // 파티클
    // particleSystem = createParticleSystem();
    // scene.add(particleSystem.mesh);

    // 기둥 빛 흐름 레이어 — 뷰어와 동일한 좌표 변환 적용
    trunkFlow = createTrunkFlow(centerX, centerY, centerZ, scale);
    rootGroup.add(trunkFlow.mesh);
    sphereParticles = createSphereParticles();
    rootGroup.add(sphereParticles.mesh);

    loadingEl.style.opacity = '0';
    setTimeout(() => {
      loadingEl.style.display = 'none';
    }, 800);
    animate();

  } catch (err) {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'flex';
    errorEl.innerHTML = `
      <div style="font-size:32px;margin-bottom:8px;">🌳</div>
      <div style="color:rgba(255,255,255,0.7); margin-bottom:12px;">${err.message}</div>
      <div style="font-size:11px; line-height:2;">
        <b style="color:rgba(255,255,255,0.5)">Please check:</b><br>
        1. Check your network connection and try refreshing.<br>
        2. If the issue persists, the 3D asset server may be temporarily unavailable.
      </div>
    `;
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const elapsed = clock.getElapsedTime();
  const idleMs = performance.now() - lastInteractionTime;
  const interacting = orbit.dragging || orbit.panning || activeTouchMode !== 'none';

  if (introActive && !interacting) {
    if (introStartTime === null) introStartTime = performance.now();
    const introT = clamp((performance.now() - introStartTime) / INTRO_CAMERA.duration, 0, 1);
    const introEase = 1 - Math.pow(1 - introT, 3);
    orbit.theta = lerp(INTRO_CAMERA.startTheta, INTRO_CAMERA.endTheta, introEase);
    orbit.phi = INTRO_CAMERA.startPhi;
    orbit.radius = lerp(INTRO_CAMERA.startRadius, INTRO_CAMERA.endRadius, introEase);
    if (introT >= 1) {
      introActive = false;
      lastInteractionTime = performance.now();
    }
  } else if (!interacting) {
    if (Math.abs(thetaVelocity) > 0.00001 || Math.abs(phiVelocity) > 0.00001) {
      orbit.theta += thetaVelocity;
      orbit.phi = clamp(orbit.phi + phiVelocity, 0.24, Math.PI - 0.24);
      thetaVelocity *= 0.92;
      phiVelocity *= 0.86;
    } else if (idleMs > 3200) {
      orbit.theta += dt * 0.065;
    }
  }

  // 스타일 보간
  if (lerpT < 1) {
    lerpT = Math.min(1, lerpT + 0.012);
    const e = 1 - Math.pow(1 - lerpT, 3);
    currentStyle = {
      ...targetStyle,
      hueShift:    lerp(currentStyle.hueShift,    targetStyle.hueShift,    e),
      satMul:      lerp(currentStyle.satMul,      targetStyle.satMul,      e),
      brightMul:   lerp(currentStyle.brightMul,   targetStyle.brightMul,   e),
      fogDensity:  lerp(currentStyle.fogDensity,  targetStyle.fogDensity,  e),
      crackOpen:   lerp(currentStyle.crackOpen,   targetStyle.crackOpen,   e),
      breathSpeed: lerp(currentStyle.breathSpeed, targetStyle.breathSpeed, e),
      pulseSize:   lerp(currentStyle.pulseSize,   targetStyle.pulseSize,   e),
      leafBreathSize: lerp(currentStyle.leafBreathSize, targetStyle.leafBreathSize, e),
      leafContract:   lerp(currentStyle.leafContract,   targetStyle.leafContract,   e),
      treeSatMul:     lerp(currentStyle.treeSatMul,     targetStyle.treeSatMul,     e),
    };
  }

  // 셰이더 유니폼 업데이트
  if (splatMaterial) {
    const u = splatMaterial.uniforms;
    u.uTime.value        = elapsed * 60;
    u.uBreathSpeed.value = currentStyle.breathSpeed;
    u.uPulseSize.value   = currentStyle.pulseSize;
    u.uCrackOpen.value   = currentStyle.crackOpen;
    u.uHueShift.value    = currentStyle.hueShift;
    u.uSatMul.value      = currentStyle.satMul;
    u.uTreeSatMul.value  = currentStyle.treeSatMul;
    u.uBrightMul.value   = currentStyle.brightMul;
  }

  // 이파리 호흡 업데이트 — AQI가 낮을수록 크게 호흡하고, 높을수록 수축
  if (leavesMaterial) {
    const u = leavesMaterial.uniforms;
    u.uTime.value        = elapsed * 60;
    u.uBreathSpeed.value = currentStyle.breathSpeed;
    u.uPulseSize.value   = currentStyle.leafBreathSize;
    u.uLeafContract.value = currentStyle.leafContract;
    u.uHueShift.value    = currentStyle.hueShift;
    u.uSatMul.value      = currentStyle.satMul;
    u.uBrightMul.value   = currentStyle.brightMul;
  }

  // 바닥 잔디 업데이트 — 움직임 없이 AQI 색/채도/밝기만 반응


  // 배경색
  const fogC = currentStyle.fogDensity;
  renderer.setClearColor(new THREE.Color(fogC*0.08, fogC*0.04, fogC*0.02));

  // 파티클
  // if (particleSystem) updateParticles(particleSystem, currentStyle, dt);

  // 기둥 빛 흐름 업데이트
  if (trunkFlow) {
    trunkFlow.update(elapsed, currentStyle);
  }
  if (sphereParticles) {
    sphereParticles.update(elapsed, currentStyle);
  }

  updateCamera();
  renderer.render(scene, camera);
}

function getLondonDateKey(date = new Date()) {
  const parts = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Europe/London',
    year: 'numeric', month: '2-digit', day: '2-digit',
  }).formatToParts(date);
  const byType = Object.fromEntries(parts.map(p => [p.type, p.value]));
  return `${byType.year}-${byType.month}-${byType.day}`;
}
function shiftDateKey(dateKey, delta) {
  const [year, month, day] = dateKey.split('-').map(Number);
  const date = new Date(Date.UTC(year, month - 1, day + delta, 12, 0, 0));
  return date.toISOString().slice(0, 10);
}
function formatDateKey(dateKey, includeYear = true) {
  const [year, month, day] = dateKey.split('-').map(Number);
  const date = new Date(Date.UTC(year, month - 1, day, 12, 0, 0));
  const options = { day: 'numeric', month: 'long', timeZone: 'UTC' };
  if (includeYear) options.year = 'numeric';
  return date.toLocaleDateString('en-GB', options);
}

// ── DAQI 변환 ─────────────────────────────────────────────
function pm25ToDAQI(v) {
  if (v <= 11) return 1; if (v <= 23) return 2; if (v <= 35) return 3;
  if (v <= 41) return 4; if (v <= 47) return 5; if (v <= 53) return 6;
  if (v <= 58) return 7; if (v <= 64) return 8; if (v <= 70) return 9;
  return 10;
}
function pm10ToDAQI(v) {
  if (v <= 16) return 1; if (v <= 33) return 2; if (v <= 50) return 3;
  if (v <= 58) return 4; if (v <= 66) return 5; if (v <= 75) return 6;
  if (v <= 83) return 7; if (v <= 91) return 8; if (v <= 100) return 9;
  return 10;
}
function no2ToDAQI(v) {
  if (v <= 67)  return 1; if (v <= 134) return 2; if (v <= 200) return 3;
  if (v <= 267) return 4; if (v <= 334) return 5; if (v <= 400) return 6;
  if (v <= 467) return 7; if (v <= 534) return 8; if (v <= 600) return 9;
  return 10;
}
function o3ToDAQI(v) {
  if (v <= 33)  return 1; if (v <= 66)  return 2; if (v <= 100) return 3;
  if (v <= 120) return 4; if (v <= 140) return 5; if (v <= 160) return 6;
  if (v <= 187) return 7; if (v <= 213) return 8; if (v <= 240) return 9;
  return 10;
}
function worstDaqiFromHourly(data, dateKey, todayOnly) {
  const times = data.hourly?.time              || [];
  const pm25v  = data.hourly?.pm2_5            || [];
  const pm10v  = data.hourly?.pm10             || [];
  const no2v   = data.hourly?.nitrogen_dioxide || [];
  const o3v    = data.hourly?.ozone            || [];
  const nowHour = new Date().toISOString().slice(0, 13);
  let worst = 0;
  for (let i = 0; i < times.length; i++) {
    if (!times[i].startsWith(dateKey)) continue;
    if (todayOnly && times[i].slice(0, 13) > nowHour) continue;
    if (!Number.isFinite(pm25v[i]) || !Number.isFinite(pm10v[i])) continue;
    const daqi = Math.max(
      pm25ToDAQI(pm25v[i]), pm10ToDAQI(pm10v[i]),
      no2ToDAQI(Number.isFinite(no2v[i]) ? no2v[i] : 0),
      o3ToDAQI(Number.isFinite(o3v[i])   ? o3v[i]  : 0)
    );
    if (daqi > worst) worst = daqi;
  }
  return worst || 1;
}
function getHourlyValue(data, dateKey, todayOnly) {
  const times = data.hourly?.time || [];
  const pm25v  = data.hourly?.pm2_5 || [];
  const pm10v  = data.hourly?.pm10  || [];
  const nowHour = new Date().toISOString().slice(0, 13);
  let worstPM25 = 0, worstPM10 = 0, worstDAQI = 0, n = 0;
  for (let i = 0; i < times.length; i++) {
    if (!times[i].startsWith(dateKey)) continue;
    if (todayOnly && times[i].slice(0, 13) > nowHour) continue;
    if (!Number.isFinite(pm25v[i]) || !Number.isFinite(pm10v[i])) continue;
    const daqi = Math.max(pm25ToDAQI(pm25v[i]), pm10ToDAQI(pm10v[i]));
    if (daqi > worstDAQI) { worstDAQI = daqi; worstPM25 = pm25v[i]; worstPM10 = pm10v[i]; }
    n++;
  }
  return n ? { pm25: worstPM25, pm10: worstPM10, count: n } : null;
}

    if (!aqi) continue;
    console.log(`[LAQN Daily] DAQI: ${aqi} (source: ${auth['@LocalAuthorityName']})`);
    return { dateKey, aqi, pm25AQI: aqi, pm10AQI: aqi, unavailable: false, sampleCount: siteArr.length };
  }
  let bestAqi = 0, bestAuth = '';
  for (const auth of authArr) {
    if (!auth.Site) continue;
    const siteArr = Array.isArray(auth.Site) ? auth.Site : [auth.Site];
    for (const s of siteArr) {
      const i = parseInt(s['@AirQualityIndex']) || 0;
      if (i > bestAqi) { bestAqi = i; bestAuth = auth['@LocalAuthorityName']; }
    }
  }
  if (!bestAqi) { console.warn('[LAQN Daily] No data from any authority'); return null; }
  console.log(`[LAQN Daily] DAQI: ${bestAqi} (source: ${bestAuth})`);
  return { dateKey, aqi: bestAqi, pm25AQI: bestAqi, pm10AQI: bestAqi, unavailable: false, sampleCount: 1 };
}
function buildFallbackRecord(dateKey) {
  return { dateKey, aqi: 1, pm25AQI: 1, pm10AQI: 1, unavailable: true, sampleCount: 0 };
}
function buildFallbackTimeline() {
  const today = getLondonDateKey();
  return Array.from({ length: 14 }, (_, i) => buildFallbackRecord(shiftDateKey(today, i - 13)));
}
async function fetchAirQualityTimeline() {
  const todayKey = getLondonDateKey();
  const dates = Array.from({ length: 14 }, (_, i) => shiftDateKey(todayKey, i - 13));
  const [omResult, laqnResult] = await Promise.allSettled([
    fetchOpenMeteo(),
    fetchLAQNDailyToday(todayKey),
  ]);
  const omData    = omResult.status  === 'fulfilled' ? omResult.value  : null;
  const todayLAQN = laqnResult.status === 'fulfilled' ? laqnResult.value : null;
  if (!omData)    console.warn('[Open-Meteo] Failed:', omResult.reason?.message);
  if (!todayLAQN) console.warn('[LAQN Daily] No reading; using Open-Meteo fallback.');
  return dates.map((dateKey, i) => {
    const isToday = i === dates.length - 1;
    if (isToday && todayLAQN) return todayLAQN;
    if (omData) {
      const worst = worstDaqiFromHourly(omData, dateKey, isToday);
      const h = getHourlyValue(omData, dateKey, isToday);
      const p25 = h ? pm25ToDAQI(h.pm25) : 1;
      const p10 = h ? pm10ToDAQI(h.pm10) : 1;
      return { dateKey, aqi: worst, pm25AQI: p25, pm10AQI: p10, unavailable: false, sampleCount: h?.count || 0 };
    }
    return buildFallbackRecord(dateKey);
  });
}

async function startApp() {
  observedDays = buildFallbackTimeline();
  airQualityDays = [...observedDays, ...buildFutureTimeline(futureScenario)];
  dateSlider.max = Math.max(0, airQualityDays.length - 1);
  const todayIndex = observedDays.length - 1;
  dateSlider.value = todayIndex;
  setSelectedDate(todayIndex);
  updateScenarioToggle();

  const r = observedDays[observedDays.length - 1];
  console.log(`Today (${r.dateKey}) DAQI:${r.aqi} PM2.5:${r.pm25AQI} PM10:${r.pm10AQI} unavailable:${r.unavailable}`);
  console.log(`Future scenario: ${FUTURE_SCENARIOS[futureScenario].label}, PDF upper line 2030-2100`);

  currentStyle = getAQIStyle(r.aqi);
  targetStyle  = { ...currentStyle };
  init();

  try {
    const freshObservedDays = await fetchAirQualityTimeline();
    observedDays = freshObservedDays;
    rebuildTimeline(selectedTimelineIndex);
    const fresh = observedDays[observedDays.length - 1];
    console.log(`Updated today (${fresh.dateKey}) DAQI:${fresh.aqi} PM2.5:${fresh.pm25AQI} PM10:${fresh.pm10AQI} unavailable:${fresh.unavailable}`);
  } catch(error) {
    console.error('Air quality data failed:', error);
  }
}

// 브라우저가 열리면 startApp 실행
window.addEventListener('load', startApp);


</script>
